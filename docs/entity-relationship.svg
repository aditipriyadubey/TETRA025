<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="100%" height="100%" style="background-color: #ffffff; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Drop Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.1"/>
    </filter>

    <!-- Crow's Foot Markers -->
    <!-- One-to-Many marker -->
    <marker id="crowsfoot" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 20 10 L 0 20 M 20 0 L 20 20" fill="none" stroke="#475569" stroke-width="2.5"/>
    </marker>
    
    <!-- One-to-One marker -->
    <marker id="oneone" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 8 0 L 8 20 M 16 0 L 16 20" fill="none" stroke="#475569" stroke-width="2.5"/>
    </marker>

    <!-- Mandatory One start marker -->
    <marker id="mandone" viewBox="0 0 20 20" refX="2" refY="10" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 4 0 L 4 20 M 12 0 L 12 20" fill="none" stroke="#475569" stroke-width="2.5"/>
    </marker>
  </defs>

  <!-- Title & Header -->
  <text x="700" y="45" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">EduBridge AI — Entity Relationship Diagram (ERD)</text>
  <text x="700" y="72" font-size="13" fill="#64748b" text-anchor="middle">Crow's Foot Notation | Logical Data Model &amp; Cardinalities</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- RELATIONSHIP LINES (DRAWN BEHIND ENTITIES)  -->
  <!-- ═══════════════════════════════════════════ -->
  
  <!-- Session -> Transcript (captures) -->
  <path d="M 430 360 L 580 360 L 580 200 L 700 200" fill="none" stroke="#475569" stroke-width="2" marker-start="url(#mandone)" marker-end="url(#crowsfoot)"/>
  <rect x="535" y="270" width="90" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="580" y="286" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">1 : N (captures)</text>

  <!-- Session -> Note (generates) -->
  <path d="M 430 400 L 700 400" fill="none" stroke="#475569" stroke-width="2" marker-start="url(#mandone)" marker-end="url(#oneone)"/>
  <rect x="535" y="388" width="90" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="580" y="404" font-size="11" font-weight="600" fill="#059669" text-anchor="middle">1 : 1 (generates)</text>

  <!-- Session -> Vocabulary (extracts) -->
  <path d="M 430 440 L 580 440 L 580 600 L 700 600" fill="none" stroke="#475569" stroke-width="2" marker-start="url(#mandone)" marker-end="url(#crowsfoot)"/>
  <rect x="535" y="510" width="90" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="580" y="526" font-size="11" font-weight="600" fill="#d97706" text-anchor="middle">1 : N (extracts)</text>

  <!-- Session -> ChatMessage (logs) -->
  <path d="M 280 500 L 280 600 L 700 600" fill="none" stroke="#475569" stroke-width="2" marker-start="url(#mandone)" marker-end="url(#crowsfoot)"/>
  <rect x="235" y="560" width="90" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="280" y="576" font-size="11" font-weight="600" fill="#7c3aed" text-anchor="middle">1 : N (logs)</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- ENTITY 1: Session (Hub)                     -->
  <!-- ═══════════════════════════════════════════ -->
  <g transform="translate(130, 260)" filter="url(#shadow)">
    <rect width="300" height="42" rx="8" ry="8" fill="#4f46e5"/>
    <rect y="34" width="300" height="8" fill="#4f46e5"/>
    <text x="150" y="26" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Session</text>
    
    <rect y="42" width="300" height="198" fill="#ffffff"/>
    <rect y="232" width="300" height="8" fill="#ffffff" rx="8" ry="8"/>
    <rect y="42" width="300" height="198" fill="none" stroke="#4f46e5" stroke-width="2" rx="8" ry="8"/>

    <text x="20" y="72" font-size="13" font-weight="700" fill="#4f46e5">session_id</text>
    <text x="280" y="72" font-size="11" font-weight="600" fill="#64748b" text-anchor="end">PK | UUID</text>
    <line x1="20" y1="84" x2="280" y2="84" stroke="#f1f5f9" stroke-width="1"/>

    <text x="20" y="106" font-size="12" font-weight="500" fill="#334155">persistence_mode</text>
    <text x="280" y="106" font-size="11" fill="#94a3b8" text-anchor="end">TEXT</text>
    <line x1="20" y1="118" x2="280" y2="118" stroke="#f1f5f9" stroke-width="1"/>

    <text x="20" y="140" font-size="12" font-weight="500" fill="#334155">language</text>
    <text x="280" y="140" font-size="11" fill="#94a3b8" text-anchor="end">TEXT</text>
    <line x1="20" y1="152" x2="280" y2="152" stroke="#f1f5f9" stroke-width="1"/>

    <text x="20" y="174" font-size="12" font-weight="500" fill="#334155">consent_token</text>
    <text x="280" y="174" font-size="11" fill="#cbd5e1" text-anchor="end">TEXT (nullable)</text>
    <line x1="20" y1="186" x2="280" y2="186" stroke="#f1f5f9" stroke-width="1"/>

    <text x="20" y="208" font-size="12" font-weight="500" fill="#334155">created_at</text>
    <text x="280" y="208" font-size="11" fill="#94a3b8" text-anchor="end">TIMESTAMPTZ</text>
  </g>

  <!-- ═══════════════════════════════════════════ -->
  <!-- ENTITY 2: Transcript                        -->
  <!-- ═══════════════════════════════════════════ -->
  <g transform="translate(700, 100)" filter="url(#shadow)">
    <rect width="320" height="42" rx="8" ry="8" fill="#2563eb"/>
    <rect y="34" width="320" height="8" fill="#2563eb"/>
    <text x="160" y="26" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Transcript</text>
    
    <rect y="42" width="320" height="200" fill="#ffffff"/>
    <rect y="234" width="320" height="8" fill="#ffffff" rx="8" ry="8"/>
    <rect y="42" width="320" height="200" fill="none" stroke="#2563eb" stroke-width="2" rx="8" ry="8"/>

    <text x="20" y="72" font-size="13" font-weight="700" fill="#2563eb">id</text>
    <text x="300" y="72" font-size="11" font-weight="600" fill="#64748b" text-anchor="end">PK | UUID</text>
    <line x1="20" y1="84" x2="300" y2="84" stroke="#f1f5f9" stroke-width="1"/>

    <text x="20" y="106" font-size="12" font-weight="700" fill="#dc2626">session_id</text>
    <text x="300" y="106" font-size="11" font-weight="600" fill="#dc2626" text-anchor="end">FK | UUID</text>
    <line x1="20" y1="118" x2="300" y2="118" stroke="#f1f5f9" stroke-width="1"/>

    <text x="20" y="140" font-size="12" font-weight="500" fill="#334155">chunk_index</text>
    <text x="300" y="140" font-size="11" fill="#94a3b8" text-anchor="end">INTEGER</text>
    <line x1="20" y1="152" x2="300" y2="152" stroke="#f1f5f9" stroke-width="1"/>

    <text x="20" y="174" font-size="12" font-weight="500" fill="#334155">text</text>
    <text x="300" y="174" font-size="11" fill="#94a3b8" text-anchor="end">TEXT</text>
    <line x1="20" y1="186" x2="300" y2="186" stroke="#f1f5f9" stroke-width="1"/>

    <text x="20" y="208" font-size="12" font-weight="500" fill="#334155">translated_text</text>
    <text x="300" y="208" font-size="11" fill="#cbd5e1" text-anchor="end">TEXT (nullable)</text>
  </g>

  <!-- ═══════════════════════════════════════════ -->
  <!-- ENTITY 3: Note                              -->
  <!-- ═══════════════════════════════════════════ -->
  <g transform="translate(700, 330)" filter="url(#shadow)">
    <rect width="320" height="42" rx="8" ry="8" fill="#059669"/>
    <rect y="34" width="320" height="8" fill="#059669"/>
    <text x="160" y="26" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Note</text>
    
    <rect y="42" width="320" height="110" fill="#ffffff"/>
    <rect y="144" width="320" height="8" fill="#ffffff" rx="8" ry="8"/>
    <rect y="42" width="320" height="110" fill="none" stroke="#059669" stroke-width="2" rx="8" ry="8"/>

    <text x="20" y="72" font-size="13" font-weight="700" fill="#059669">session_id</text>
    <text x="300" y="72" font-size="11" font-weight="600" fill="#059669" text-anchor="end">PK, FK | UUID</text>
    <line x1="20" y1="84" x2="300" y2="84" stroke="#f1f5f9" stroke-width="1"/>

    <text x="20" y="106" font-size="12" font-weight="500" fill="#334155">content_markdown</text>
    <text x="300" y="106" font-size="11" fill="#94a3b8" text-anchor="end">TEXT</text>
    <line x1="20" y1="118" x2="300" y2="118" stroke="#f1f5f9" stroke-width="1"/>

    <text x="20" y="136" font-size="12" font-weight="500" fill="#334155">updated_at</text>
    <text x="300" y="136" font-size="11" fill="#94a3b8" text-anchor="end">TIMESTAMPTZ</text>
  </g>

  <!-- ═══════════════════════════════════════════ -->
  <!-- ENTITY 4: Vocabulary                        -->
  <!-- ═══════════════════════════════════════════ -->
  <g transform="translate(700, 480)" filter="url(#shadow)">
    <rect width="320" height="42" rx="8" ry="8" fill="#d97706"/>
    <rect y="34" width="320" height="8" fill="#d97706"/>
    <text x="160" y="26" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Vocabulary</text>
    
    <rect y="42" width="320" height="230" fill="#ffffff"/>
    <rect y="264" width="320" height="8" fill="#ffffff" rx="8" ry="8"/>
    <rect y="42" width="320" height="230" fill="none" stroke="#d97706" stroke-width="2" rx="8" ry="8"/>

    <text x="20" y="72" font-size="13" font-weight="700" fill="#d97706">id</text>
    <text x="300" y="72" font-size="11" font-weight="600" fill="#64748b" text-anchor="end">PK | UUID</text>
    <line x1="20" y1="84" x2="300" y2="84" stroke="#f1f5f9" stroke-width="1"/>

    <text x="20" y="106" font-size="12" font-weight="700" fill="#dc2626">session_id</text>
    <text x="300" y="106" font-size="11" font-weight="600" fill="#dc2626" text-anchor="end">FK | UUID</text>
    <line x1="20" y1="118" x2="300" y2="118" stroke="#f1f5f9" stroke-width="1"/>

    <text x="20" y="140" font-size="12" font-weight="500" fill="#334155">term</text>
    <text x="300" y="140" font-size="11" fill="#94a3b8" text-anchor="end">TEXT</text>
    <line x1="20" y1="152" x2="300" y2="152" stroke="#f1f5f9" stroke-width="1"/>

    <text x="20" y="174" font-size="12" font-weight="500" fill="#334155">definition</text>
    <text x="300" y="174" font-size="11" fill="#94a3b8" text-anchor="end">TEXT</text>
    <line x1="20" y1="186" x2="300" y2="186" stroke="#f1f5f9" stroke-width="1"/>

    <text x="20" y="208" font-size="12" font-weight="500" fill="#334155">analogy</text>
    <text x="300" y="208" font-size="11" fill="#cbd5e1" text-anchor="end">TEXT (nullable)</text>
    <line x1="20" y1="220" x2="300" y2="220" stroke="#f1f5f9" stroke-width="1"/>

    <text x="20" y="242" font-size="12" font-weight="500" fill="#334155">translation</text>
    <text x="300" y="242" font-size="11" fill="#cbd5e1" text-anchor="end">TEXT (nullable)</text>
  </g>

  <!-- ═══════════════════════════════════════════ -->
  <!-- ENTITY 5: ChatMessage                       -->
  <!-- ═══════════════════════════════════════════ -->
  <g transform="translate(1060, 260)" filter="url(#shadow)">
    <rect width="280" height="42" rx="8" ry="8" fill="#7c3aed"/>
    <rect y="34" width="280" height="8" fill="#7c3aed"/>
    <text x="140" y="26" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">ChatMessage</text>
    
    <rect y="42" width="280" height="198" fill="#ffffff"/>
    <rect y="232" width="280" height="8" fill="#ffffff" rx="8" ry="8"/>
    <rect y="42" width="280" height="198" fill="none" stroke="#7c3aed" stroke-width="2" rx="8" ry="8"/>

    <text x="20" y="72" font-size="13" font-weight="700" fill="#7c3aed">id</text>
    <text x="260" y="72" font-size="11" font-weight="600" fill="#64748b" text-anchor="end">PK | UUID</text>
    <line x1="20" y1="84" x2="260" y2="84" stroke="#f1f5f9" stroke-width="1"/>

    <text x="20" y="106" font-size="12" font-weight="700" fill="#dc2626">session_id</text>
    <text x="260" y="106" font-size="11" font-weight="600" fill="#dc2626" text-anchor="end">FK | UUID</text>
    <line x1="20" y1="118" x2="260" y2="118" stroke="#f1f5f9" stroke-width="1"/>

    <text x="20" y="140" font-size="12" font-weight="500" fill="#334155">role</text>
    <text x="260" y="140" font-size="11" fill="#94a3b8" text-anchor="end">user / assistant</text>
    <line x1="20" y1="152" x2="260" y2="152" stroke="#f1f5f9" stroke-width="1"/>

    <text x="20" y="174" font-size="12" font-weight="500" fill="#334155">content</text>
    <text x="260" y="174" font-size="11" fill="#94a3b8" text-anchor="end">TEXT</text>
    <line x1="20" y1="186" x2="260" y2="186" stroke="#f1f5f9" stroke-width="1"/>

    <text x="20" y="208" font-size="12" font-weight="500" fill="#334155">created_at</text>
    <text x="260" y="208" font-size="11" fill="#94a3b8" text-anchor="end">TIMESTAMPTZ</text>
  </g>

  <!-- Legend Box -->
  <g transform="translate(130, 560)">
    <rect width="300" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="16" y="26" font-size="13" font-weight="700" fill="#0f172a">Crow's Foot ERD Legend</text>

    <!-- 1:N symbol -->
    <path d="M 16 50 L 40 50 M 30 42 L 40 50 L 30 58 M 40 42 L 40 58" fill="none" stroke="#475569" stroke-width="2"/>
    <text x="55" y="54" font-size="11" fill="#334155">One-to-Many (1 : N)</text>

    <!-- 1:1 symbol -->
    <path d="M 16 85 L 40 85 M 28 77 L 28 93 M 36 77 L 36 93" fill="none" stroke="#475569" stroke-width="2"/>
    <text x="55" y="89" font-size="11" fill="#334155">One-to-One (1 : 1)</text>

    <text x="16" y="122" font-size="11" fill="#dc2626" font-weight="600">FK</text>
    <text x="35" y="122" font-size="11" fill="#64748b">Foreign Key (ON DELETE CASCADE)</text>
  </g>
</svg>
